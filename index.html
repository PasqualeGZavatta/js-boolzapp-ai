<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boolzapp AI</title>
  <link rel="icon" type="image/ico" href="img/favicon.ico" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icon -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  <!-- Styles -->
  <link rel="stylesheet" href="./css/app.css" />
  <!-- Script JS -->
  <script src="./js/config.js"></script>
  <script src="./js/app.js" defer></script>
</head>

<body>
  <!-- Intestazione -->
  <header class="app-header">
    <div class="header-left">
      <img src="img/contact-pic.jpg" alt="Contact picture" />
      <div class="contact-info">
        <h3 class="conctact-name">Silv-IA</h3>
        <p class="contact-status">Online 🟢</p>
      </div>
    </div>
    <select id="personality-select">

      <option value="0">Amichevole</option>
      <option value="1">Psicopatica</option>
      <option value="2">Stronza</option>
      <option value="3">Lunatica</option>
      <option value="4">Amorevole</option>
      <option value="5">Federica</option>
    </select>

    <div class="tema">
      <i class="bi bi-brightness-high"></i>
      <div class="form-check form-switch ">
        <input class="form-check-input" type="checkbox" id="mioInterruttore">
        <label class="form-check-label" for="mioInterruttore"></label>
      </div>
      <i class="bi bi-moon"></i>
    </div>
    <div class="header-right ">




      <i class="bi bi-search"></i>


      <i class="bi bi-journal-medical"></i>

      <i class="bi bi-three-dots"></i>
    </div>
  </header>

  <!-- Box delle chat -->
  <div id="sfondo" class="chat-box ">
    <!-- Qui, i messaggi li mette JS -->
    <div id="new-text-box">

    </div>
  </div>

  <!-- Fondo pagina -->
  <footer class="app-footer">
    <form action="">
      <input id="my-text" type="text" placeholder="Scrivi qui..." />

      <button type="submit">
        <i class="bi bi-arrow-up-circle-fill"></i>
      </button>
    </form>
  </footer>
</body>

</html>
